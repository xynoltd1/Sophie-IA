<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="titre">
  <title id="titre">Un artisan agenouillé répare un tuyau sous un évier, les deux mains prises, pendant que son téléphone sonne par terre à côté de lui et affiche trois appels manqués.</title>
  <defs>
    <radialGradient id="lueur" cx="42%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#8ddcbb" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8ddcbb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="combi" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#15806010"/><stop offset="0%" stop-color="#1b8a68"/>
      <stop offset="100%" stop-color="#0a6b4f"/>
    </linearGradient>
    <linearGradient id="meuble" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f3e3c6"/><stop offset="100%" stop-color="#e0c79c"/>
    </linearGradient>
    <linearGradient id="tuyau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e2df"/><stop offset="45%" stop-color="#aab7b3"/>
      <stop offset="100%" stop-color="#7f8d89"/>
    </linearGradient>
    <linearGradient id="verre" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e6f1ec"/>
    </linearGradient>
    <linearGradient id="peau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6cfab"/><stop offset="100%" stop-color="#e5b289"/>
    </linearGradient>
  </defs>
  <style>
    .respire { animation: r 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
    .goutte  { animation: g 2.6s ease-in infinite }
    @keyframes r { 0%,100% { opacity: .25; transform: scale(.85) } 55% { opacity: .9; transform: scale(1.25) } }
    @keyframes g { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(26px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .respire, .goutte { animation: none } }
  </style>

  <ellipse cx="195" cy="150" rx="210" ry="152" fill="url(#lueur)"/>

  <!-- Le meuble sous évier, ouvert. Il cadre la scène et dit où l'on est. -->
  <path d="M46 36h188a8 8 0 0 1 8 8v206H38V44a8 8 0 0 1 8-8Z" fill="url(#meuble)"/>
  <path d="M58 52h164v150H58z" fill="#2a211a" opacity="0.14"/>
  <path d="M58 52h164v150H58z" fill="#1b2b26" opacity="0.5"/>
  <!-- La porte ouverte, en perspective. -->
  <path d="M242 44 286 24v218l-44 16Z" fill="#e8d1a8"/>
  <path d="M242 44 286 24v218l-44 16Z" fill="#000" opacity="0.06"/>
  <circle cx="252" cy="140" r="4" fill="#9a8460"/>

  <!-- La tuyauterie, et la fuite. -->
  <path d="M132 52v58" stroke="url(#tuyau)" stroke-width="15" stroke-linecap="round"/>
  <path d="M132 110q0 24 26 24h34" stroke="url(#tuyau)" stroke-width="15" fill="none" stroke-linecap="round"/>
  <rect x="121" y="100" width="22" height="16" rx="4" fill="#0a6b4f"/>
  <rect x="121" y="100" width="22" height="6" rx="3" fill="#12a271"/>
  <g class="goutte"><circle cx="132" cy="122" r="3.6" fill="#5fb8e8"/></g>
  <g class="goutte" style="animation-delay:1.1s"><circle cx="132" cy="122" r="3" fill="#5fb8e8"/></g>
  <ellipse cx="132" cy="252" rx="20" ry="5" fill="#5fb8e8" opacity="0.35"/>

  <!-- L'artisan, agenouillé, vu de dos. Pas de visage : le sujet est la
       posture — penché dans le meuble, les deux mains occupées. -->
  <ellipse cx="196" cy="254" rx="86" ry="11" fill="#0e1c18" opacity="0.13"/>
  <!-- Jambe repliée -->
  <path d="M236 200q34 6 44 30t-6 26h-48q-10-28 10-56Z" fill="#0a6b4f"/>
  <path d="M268 246h30a7 7 0 0 1 0 14h-34Z" fill="#1d3b33"/>
  <!-- Torse penché vers le meuble -->
  <path d="M176 136q54-16 86 18 20 22 8 54-38 16-70-6-28-20-24-66Z" fill="url(#combi)"/>
  <!-- Bretelle, pour que la combinaison se lise comme un vêtement de travail -->
  <path d="M206 128q18 20 28 50" stroke="#0d5c44" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Bras tendus dans le meuble, vers la fuite -->
  <path d="M182 158q-32 2-46 -12" stroke="url(#combi)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M190 190q-34 6-54 -10" stroke="#0d5c44" stroke-width="20" fill="none" stroke-linecap="round"/>
  <ellipse cx="134" cy="146" rx="12" ry="10" fill="url(#peau)" transform="rotate(-18 134 146)"/>
  <ellipse cx="136" cy="180" rx="12" ry="10" fill="url(#peau)" transform="rotate(12 136 180)"/>
  <!-- Tête, de dos, avec casquette -->
  <circle cx="214" cy="120" r="25" fill="url(#peau)"/>
  <path d="M190 116a24 24 0 0 1 48 0Z" fill="#124a38"/>
  <path d="M188 116h-16a5 5 0 0 0 0 10h20Z" fill="#0d3a2c"/>
  <!-- Clé à molette, dans la main gauche -->
  <path d="M150 196l-26 14" stroke="#8e9b97" stroke-width="7" stroke-linecap="round"/>
  <path d="M126 204a9 9 0 1 1 -12 10l8-6Z" fill="#7a8783"/>

  <!-- Le téléphone, par terre, hors de portée. C'est le point de bascule
       de l'image : il sonne, et personne ne peut le prendre. -->
  <g>
    <ellipse cx="360" cy="258" rx="40" ry="8" fill="#0e1c18" opacity="0.12"/>
    <rect x="330" y="150" width="62" height="104" rx="13" fill="#132f27"/>
    <rect x="335" y="155" width="52" height="94" rx="9" fill="url(#verre)"/>
    <text x="361" y="176" text-anchor="middle" font-size="8.5" fill="#7f8d87" font-family="system-ui,sans-serif">Appel entrant</text>
    <circle cx="361" cy="196" r="13" fill="#dcece5"/>
    <path d="M361 190a4.6 4.6 0 1 1 0 9.2 4.6 4.6 0 0 1 0-9.2Zm0 11c4.4 0 8 2.2 8 4.9v1.2h-16v-1.2c0-2.7 3.6-4.9 8-4.9Z" fill="#0a6b4f"/>
    <rect x="345" y="216" width="32" height="4" rx="2" fill="#cbd8d2"/>
    <circle cx="349" cy="236" r="9" fill="#f3d7d2"/>
    <path d="M345.5 232.5l7 7m0-7l-7 7" stroke="#b3210b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="373" cy="236" r="9" fill="#12a271"/>
    <path d="M369 233.5c1.4 2.5 2.8 3.9 5.3 5.3l1.6-1.8c.24-.28.63-.35.94-.2l1.96.94c.35.17.51.55.43.9l-.4 1.7c-.08.4-.43.63-.82.6a8.9 8.9 0 0 1-8.56-8.56c-.04-.4.2-.75.6-.82l1.7-.4c.35-.8.73.8.9.43l.94 1.96c.15.31.8.7-.2.94Z" fill="#fff"/>
    <!-- La sonnerie, en arcs sur le côté. Des anneaux complets autour du
         téléphone traverseraient la pile d'appels manqués et se liraient
         comme des traits perdus. -->
    <g fill="none" stroke="#0a6b4f" stroke-linecap="round">
      <path class="respire" d="M400 190a22 22 0 0 1 0 24" stroke-width="2.6"/>
      <path class="respire" d="M409 180a34 34 0 0 1 0 44" stroke-width="2.3" style="animation-delay:.5s"/>
      <path class="respire" d="M418 170a46 46 0 0 1 0 64" stroke-width="2" style="animation-delay:1s"/>
    </g>
  </g>

  <!-- Les appels déjà manqués, empilés. Ce sont eux qui font l'histoire. -->
  <g>
    <rect x="296" y="56" width="128" height="34" rx="11" fill="#fff" stroke="#e5ded4"/>
    <circle cx="315" cy="73" r="8" fill="#fae5e1"/>
    <path d="M311 70.5l8 5m0-5l-8 5" stroke="#b3210b" stroke-width="1.8" stroke-linecap="round"/>
    <text x="330" y="70" font-size="9" fill="#7f8d87" font-family="system-ui,sans-serif">Appel manqué</text>
    <text x="330" y="82" font-size="10" font-weight="600" fill="#0e1c18" font-family="system-ui,sans-serif">il y a 4 minutes</text>
  </g>
  <rect x="302" y="98" width="116" height="12" rx="6" fill="#fff" stroke="#e5ded4" opacity="0.85"/>
  <rect x="308" y="116" width="104" height="10" rx="5" fill="#fff" stroke="#e5ded4" opacity="0.6"/>
</svg>
