<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-labelledby="t">
  <title id="t">Une bulle de conversation est transformée en fiche structurée : nom, adresse, problème.</title>
  <defs>
    <linearGradient id="v2" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#12a271"/><stop offset="100%" stop-color="#0a6b4f"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef5f1"/></linearGradient>
    <radialGradient id="h2" cx="50%" cy="46%" r="54%"><stop offset="0%" stop-color="#8ddcbb" stop-opacity="0.5"/><stop offset="100%" stop-color="#8ddcbb" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .f{animation:f 6.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .g{animation:f 5.2s ease-in-out infinite .7s;transform-box:fill-box;transform-origin:center}
    .c{animation:c 2.8s ease-in-out infinite}
    @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes c{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.f,.g,.c{animation:none}}
  </style>
  <ellipse cx="100" cy="76" rx="92" ry="70" fill="url(#h2)"/>
  <!-- Ce que le client dit -->
  <g class="f">
    <rect x="8" y="24" width="84" height="40" rx="13" fill="url(#v2)"/>
    <path d="M22 64l-2 12 13-12Z" fill="#0a6b4f"/>
    <rect x="19" y="36" width="60" height="4.6" rx="2.3" fill="#fff" opacity="0.92"/>
    <rect x="19" y="46" width="44" height="4.6" rx="2.3" fill="#fff" opacity="0.6"/>
  </g>
  <!-- La flèche de transformation -->
  <path class="c" d="M88 92h16m-6-5 6 5-6 5" stroke="#0a6b4f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ce que Zeli en fait -->
  <g class="g">
    <ellipse cx="154" cy="140" rx="38" ry="6" fill="#0e1c18" opacity="0.1"/>
    <rect x="114" y="40" width="80" height="94" rx="12" fill="url(#p2)" stroke="#dde7e2"/>
    <rect x="114" y="40" width="80" height="20" rx="12" fill="#dcece5"/>
    <rect x="114" y="52" width="80" height="8" fill="#dcece5"/>
    <text x="124" y="54" font-size="8.5" font-weight="700" fill="#0a6b4f" font-family="system-ui,sans-serif">FICHE CLIENT</text>
    <g font-family="system-ui,sans-serif">
      <text x="124" y="76" font-size="7" fill="#7f8d87">Nom</text>
      <rect x="124" y="80" width="42" height="4.4" rx="2.2" fill="#0e1c18" opacity="0.72"/>
      <text x="124" y="98" font-size="7" fill="#7f8d87">Adresse</text>
      <rect x="124" y="102" width="58" height="4.4" rx="2.2" fill="#0e1c18" opacity="0.72"/>
      <text x="124" y="120" font-size="7" fill="#7f8d87">Problème</text>
      <rect x="124" y="124" width="50" height="4.4" rx="2.2" fill="#0e1c18" opacity="0.72"/>
    </g>
  </g>
</svg>
