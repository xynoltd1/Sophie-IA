<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="t">
  <title id="t">Un appel se déroule : le téléphone du client à gauche, les répliques au centre, et le rendez-vous préparé à droite.</title>
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#12a271"/><stop offset="100%" stop-color="#0a6b4f"/></linearGradient>
    <linearGradient id="dp" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef5f1"/></linearGradient>
    <linearGradient id="dc" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1d3b33"/><stop offset="100%" stop-color="#0c211c"/></linearGradient>
    <radialGradient id="dh" cx="34%" cy="42%" r="62%"><stop offset="0%" stop-color="#8ddcbb" stop-opacity="0.42"/><stop offset="100%" stop-color="#8ddcbb" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .o{animation:o 1.25s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .f{animation:f 6.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .g{animation:f 5.4s ease-in-out infinite .9s;transform-box:fill-box;transform-origin:center}
    .d{animation:d 4s ease-in-out infinite}
    @keyframes o{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes d{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:-16}}
    @media (prefers-reduced-motion:reduce){.o,.f,.g,.d{animation:none}}
  </style>
  <ellipse cx="190" cy="140" rx="230" ry="150" fill="url(#dh)"/>

  <!-- Le téléphone du client -->
  <g class="f">
    <ellipse cx="74" cy="268" rx="44" ry="8" fill="#0e1c18" opacity="0.12"/>
    <rect x="36" y="56" width="76" height="200" rx="18" fill="url(#dc)"/>
    <rect x="42" y="62" width="64" height="188" rx="13" fill="url(#dp)"/>
    <rect x="62" y="68" width="24" height="4" rx="2" fill="#0c211c" opacity="0.5"/>
    <text x="74" y="92" text-anchor="middle" font-size="6.6" fill="#7f8d87" font-family="system-ui,sans-serif">En communication</text>
    <text x="74" y="110" text-anchor="middle" font-size="10" font-weight="700" fill="#0e1c18" font-family="system-ui,sans-serif">Martin</text>
    <text x="74" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#0e1c18" font-family="system-ui,sans-serif">Plomberie</text>
    <g>
      <rect class="o" x="52" y="146" width="4.5" height="14" rx="2.2" fill="#0a6b4f"/>
      <rect class="o" x="60" y="140" width="4.5" height="26" rx="2.2" fill="#0a6b4f" style="animation-delay:.14s"/>
      <rect class="o" x="68" y="134" width="4.5" height="38" rx="2.2" fill="#12a271" style="animation-delay:.05s"/>
      <rect class="o" x="76" y="142" width="4.5" height="22" rx="2.2" fill="#0a6b4f" style="animation-delay:.2s"/>
      <rect class="o" x="84" y="148" width="4.5" height="11" rx="2.2" fill="#0a6b4f" style="animation-delay:.3s"/>
    </g>
    <text x="74" y="190" text-anchor="middle" font-size="7.4" fill="#4d5c56" font-family="system-ui,sans-serif">Zeli répond</text>
    <circle cx="74" cy="222" r="14" fill="#f3d7d2"/>
    <path d="M68 216l12 12m0-12l-12 12" stroke="#b3210b" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Les répliques, au centre -->
  <g class="g">
    <rect x="136" y="48" width="150" height="38" rx="13" fill="url(#dv)"/>
    <text x="150" y="66" font-size="8.4" fill="#ffffff" font-family="system-ui,sans-serif">Martin Plomberie, bonjour.</text>
    <text x="150" y="78" font-size="8.4" fill="#bfe9d8" font-family="system-ui,sans-serif">Je suis Zeli, assistante virtuelle.</text>
    <path d="M148 86l-2 11 12-11Z" fill="#0a6b4f"/>

    <rect x="160" y="108" width="126" height="30" rx="12" fill="url(#dp)" stroke="#dde7e2"/>
    <text x="174" y="127" font-size="8.4" fill="#0e1c18" font-family="system-ui,sans-serif">J’ai une fuite sous l’évier.</text>
    <path d="M272 138l3 10-13-10Z" fill="#eef5f1"/>

    <rect x="136" y="158" width="152" height="30" rx="12" fill="url(#dv)"/>
    <text x="150" y="177" font-size="8.4" fill="#ffffff" font-family="system-ui,sans-serif">Mardi 14 h vous convient ?</text>
    <path d="M148 188l-2 11 12-11Z" fill="#0a6b4f"/>

    <rect x="196" y="208" width="90" height="28" rx="12" fill="url(#dp)" stroke="#dde7e2"/>
    <text x="210" y="226" font-size="8.4" fill="#0e1c18" font-family="system-ui,sans-serif">Oui, parfait.</text>
  </g>

  <!-- Le trait qui relie la conversation au résultat -->
  <path class="d" d="M292 150h24" stroke="#0a6b4f" stroke-width="2.2" stroke-dasharray="5 5" stroke-linecap="round" fill="none"/>

  <!-- Le rendez-vous préparé -->
  <g class="f" style="animation-delay:1.4s">
    <ellipse cx="376" cy="256" rx="52" ry="8" fill="#0e1c18" opacity="0.1"/>
    <rect x="318" y="76" width="116" height="148" rx="15" fill="url(#dp)" stroke="#dde7e2"/>
    <rect x="318" y="76" width="5" height="148" rx="2.5" fill="#0a6b4f"/>
    <text x="336" y="100" font-size="8" font-weight="700" fill="#0a6b4f" font-family="system-ui,sans-serif">À VALIDER</text>
    <text x="336" y="122" font-size="12" font-weight="700" fill="#0e1c18" font-family="system-ui,sans-serif">Mardi · 14 h</text>
    <text x="336" y="138" font-size="8.4" fill="#4d5c56" font-family="system-ui,sans-serif">Fuite sous évier</text>
    <text x="336" y="152" font-size="8.4" fill="#7f8d87" font-family="system-ui,sans-serif">Rue des Tanneurs</text>
    <rect x="336" y="164" width="76" height="3.6" rx="1.8" fill="#dbe4e0"/>
    <rect x="336" y="172" width="56" height="3.6" rx="1.8" fill="#dbe4e0"/>
    <rect x="336" y="192" width="40" height="18" rx="9" fill="#eef2ef" stroke="#dde7e2"/>
    <text x="356" y="204" text-anchor="middle" font-size="8" fill="#7f8d87" font-family="system-ui,sans-serif">Refuser</text>
    <rect x="382" y="192" width="40" height="18" rx="9" fill="url(#dv)"/>
    <text x="402" y="204" text-anchor="middle" font-size="8" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">Valider</text>
  </g>
</svg>
