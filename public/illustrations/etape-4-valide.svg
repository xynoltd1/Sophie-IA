<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-labelledby="t">
  <title id="t">Une fiche de rendez-vous à valider, avec un pouce qui appuie sur le bouton Accepter.</title>
  <defs>
    <linearGradient id="p4" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef5f1"/></linearGradient>
    <linearGradient id="v4" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#12a271"/><stop offset="100%" stop-color="#0a6b4f"/></linearGradient>
    <linearGradient id="peau4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f6cfab"/><stop offset="100%" stop-color="#e5b289"/></linearGradient>
    <radialGradient id="h4" cx="50%" cy="46%" r="54%"><stop offset="0%" stop-color="#8ddcbb" stop-opacity="0.5"/><stop offset="100%" stop-color="#8ddcbb" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .f{animation:f 6.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .t{animation:t 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .e{animation:e 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes t{0%,100%{transform:translate(0,0)}46%{transform:translate(-3px,-5px)}}
    @keyframes e{0%,55%{opacity:0;transform:scale(.4)}75%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.5)}}
    @media (prefers-reduced-motion:reduce){.f,.t,.e{animation:none}.e{opacity:1;transform:none}}
  </style>
  <ellipse cx="100" cy="76" rx="92" ry="70" fill="url(#h4)"/>
  <ellipse cx="96" cy="146" rx="58" ry="7" fill="#0e1c18" opacity="0.1"/>
  <g class="f">
    <rect x="36" y="20" width="126" height="104" rx="13" fill="url(#p4)" stroke="#dde7e2"/>
    <rect x="36" y="20" width="5" height="104" rx="2.5" fill="#0a6b4f"/>
    <text x="54" y="42" font-size="7.6" font-weight="700" fill="#0a6b4f" font-family="system-ui,sans-serif">À VALIDER</text>
    <text x="54" y="60" font-size="11" font-weight="700" fill="#0e1c18" font-family="system-ui,sans-serif">Mardi · 14 h 00</text>
    <text x="54" y="74" font-size="8" fill="#4d5c56" font-family="system-ui,sans-serif">Fuite sous évier</text>
    <rect x="54" y="84" width="60" height="3.6" rx="1.8" fill="#dbe4e0"/>
    <rect x="54" y="92" width="44" height="3.6" rx="1.8" fill="#dbe4e0"/>
    <rect x="54" y="104" width="38" height="14" rx="7" fill="#eef2ef" stroke="#dde7e2"/>
    <text x="73" y="114" text-anchor="middle" font-size="7.4" fill="#7f8d87" font-family="system-ui,sans-serif">Refuser</text>
    <rect x="100" y="104" width="48" height="14" rx="7" fill="url(#v4)"/>
    <text x="124" y="114" text-anchor="middle" font-size="7.4" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">Accepter</text>
    <circle class="e" cx="124" cy="111" r="17" fill="none" stroke="#12a271" stroke-width="2"/>
  </g>
  <!-- Le pouce : la décision reste humaine, et l'image doit le dire. -->
  <g class="t">
    <path d="M112 146c0-7 6-11 12-11h4l-2-10c-.6-3 1.4-5.6 4.3-5.6 2 0 3.8 1.3 4.5 3.2l5 14h10a6 6 0 0 1 6 6v10a8 8 0 0 1-8 8h-24a12 12 0 0 1-12-12Z" fill="url(#peau4)"/>
    <path d="M120 155h30" stroke="#d9a177" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
